<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dimer Lab — Minsung Kho</title>
<meta name="description" content="Draw a bipartite graph on the torus and get its Kasteleyn matrix, toric diagram, zig-zag paths, quiver, superpotential and Goncharov–Kenyon integrable system.">
<script>try{if(!localStorage.getItem("dimerlab.theme"))document.documentElement.dataset.theme="dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --canvas:#F9FAFB;
  --ink:#18212D; --ink-2:#556172; --ink-3:#8A95A4; --rule:#D8DEE6; --rule-2:#E7EBF0;
  --accent:#2353C4; --accent-ink:#FFFFFF; --accent-soft:#E2E9F9;
  --ok:#1D7A4E; --bad:#B23B2A; --warn:#946411;
  --node-w:#FFFFFF; --node-w-stroke:#18212D; --node-b:#18212D; --node-b-stroke:#18212D;
  --edge:#2B3644; --ghost:.34; --face-hl:rgba(35,83,196,.14);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --math:'STIX Two Text','Cambria Math','Times New Roman',serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0b0d1a; --surface:#12162c; --surface-2:#181d3a; --canvas:#0e1224;
    --ink:#eceaf6; --ink-2:#9aa0c4; --ink-3:#5f6796; --rule:#2c3364; --rule-2:#21274d;
    --accent:#f2c14e; --accent-ink:#1a1405; --accent-soft:rgba(242,193,78,.14);
    --ok:#7ee787; --bad:#ff6ba9; --warn:#f2c14e;
    --node-w:#eceaf6; --node-w-stroke:#0b0d1a; --node-b:#0b0d1a; --node-b-stroke:#c9cde6;
    --edge:#b9bfe0; --ghost:.30; --face-hl:rgba(242,193,78,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0b0d1a; --surface:#12162c; --surface-2:#181d3a; --canvas:#0e1224;
  --ink:#eceaf6; --ink-2:#9aa0c4; --ink-3:#5f6796; --rule:#2c3364; --rule-2:#21274d;
  --accent:#f2c14e; --accent-ink:#1a1405; --accent-soft:rgba(242,193,78,.14);
  --ok:#7ee787; --bad:#ff6ba9; --warn:#f2c14e;
  --node-w:#eceaf6; --node-w-stroke:#0b0d1a; --node-b:#0b0d1a; --node-b-stroke:#c9cde6;
  --edge:#b9bfe0; --ghost:.30; --face-hl:rgba(242,193,78,.14);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:56px minmax(0,1fr) minmax(380px,34vw);grid-template-rows:52px minmax(0,1fr);height:100%;}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px 0 16px;background:var(--surface);border-bottom:1px solid var(--rule)}
.back{color:var(--ink-2);text-decoration:none;font-size:13px;white-space:nowrap;border-right:1px solid var(--rule);padding-right:12px}
.back:hover{color:var(--accent)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font:600 17px/1 var(--sans);margin:0;letter-spacing:-.01em;white-space:nowrap}
.brand h1 .mark{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--ink);margin-right:2px;vertical-align:-1px}
.brand h1 .mark.b{background:var(--ink);margin-right:7px}
.brand p{margin:0;color:var(--ink-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:6px 11px;line-height:1.2;white-space:nowrap}
.hbtn:hover{background:var(--surface-2)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hbtn.icon{padding:6px 8px;display:inline-flex;align-items:center}
.hgroup{display:flex;gap:6px;align-items:center}
.rail{grid-row:2;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.tool{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:none;display:grid;place-items:center;position:relative;color:var(--ink-2)}
.tool:hover{background:var(--surface-2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tool kbd{position:absolute;right:3px;bottom:2px;font:500 9px/1 var(--sans);color:var(--ink-3)}
.rail hr{width:28px;border:0;border-top:1px solid var(--rule);margin:6px 0}
.stage{grid-row:2;position:relative;min-width:0;background:var(--canvas);overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.stage-top{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.stage-top > *{pointer-events:auto}
.hint{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--ink-2);max-width:420px}
.hint b{color:var(--ink);font-weight:500}
.viewbar{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.chip{border:1px solid var(--rule);background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--surface)}
.chip[aria-pressed="true"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.stage-bottom{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.stage-bottom > *{pointer-events:auto}
.zoom{display:flex;background:var(--surface);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.zoom button{border:0;background:none;padding:5px 10px;color:var(--ink-2)}
.zoom button:hover{background:var(--surface-2);color:var(--ink)}
.zoom button+button{border-left:1px solid var(--rule)}
.statusline{font-size:12.5px;color:var(--ink-2);background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--rule);border-radius:8px;padding:5px 10px}
.inspector{position:absolute;left:12px;bottom:52px;width:250px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13px;box-shadow:0 6px 24px -12px rgba(0,0,0,.25)}
.inspector[hidden]{display:none}
.inspector h3{margin:0 0 6px;font:500 14px/1.3 var(--sans);display:flex;justify-content:space-between;gap:8px}
.inspector .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
.inspector label{color:var(--ink-2)}
.inspector select,.inspector input[type=number]{border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:2px 6px;width:128px}
.inspector input[type=range]{width:120px}
.inspector .actions{display:flex;gap:6px;margin-top:8px}
.inspector .actions button{flex:1;border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:4px 6px;font-size:12.5px}
.inspector .actions button.danger{color:var(--bad)}
aside.panel{grid-row:2;background:var(--surface);border-left:1px solid var(--rule);display:flex;flex-direction:column;min-width:0;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 10px 9px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;font-size:13.5px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabbody{flex:1;overflow:auto;padding:16px 18px 40px}
.tabbody h2{font:600 15px/1.3 var(--sans);margin:22px 0 8px}
.tabbody h2:first-child{margin-top:0}
.tabbody p{margin:6px 0;color:var(--ink-2);max-width:68ch}
.lede{font:400 24px/1.25 var(--math);margin:0 0 4px;color:var(--ink)}
.sublede{color:var(--ink-2);margin:0 0 14px}
.summary-grid{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px;align-items:start}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0}
dl.facts dt{color:var(--ink-2)}
dl.facts dd{margin:0;font-variant-numeric:tabular-nums}
ul.checks{list-style:none;padding:0;margin:8px 0 0}
ul.checks li{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:6px 0;border-top:1px solid var(--rule-2)}
ul.checks li:first-child{border-top:0}
ul.checks .st{font-weight:600}
ul.checks .st.ok{color:var(--ok)} ul.checks .st.bad{color:var(--bad)} ul.checks .st.na{color:var(--ink-3)}
ul.checks small{display:block;color:var(--ink-2);font-size:12.5px}
.msg{border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.msg.err{background:color-mix(in srgb,var(--bad) 10%,transparent);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent)}
.msg.warn{background:color-mix(in srgb,var(--warn) 10%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.empty{color:var(--ink-2);padding:30px 4px;text-align:left}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px;font-size:15px}
table.t{border-collapse:collapse;font-size:13px;margin:6px 0}
table.t th,table.t td{border-bottom:1px solid var(--rule-2);padding:5px 8px;text-align:left;vertical-align:middle}
table.t th{color:var(--ink-2);font-weight:500;font-size:12.5px}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
table.kast td{text-align:center;font-family:var(--math);font-size:15px;white-space:nowrap;border:1px solid var(--rule-2);padding:6px 10px}
table.kast th{text-align:center}
.m{font-family:var(--math);font-size:15.5px;line-height:1.9}
.m i{font-style:italic}
.m sub,.m sup{font-size:.72em;line-height:0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15}
.frac>span{padding:0 .15em}
.frac>span:first-child{border-bottom:1px solid currentColor}
.op{margin:0}
.tm{white-space:nowrap}
.item{border-top:1px solid var(--rule-2);padding:9px 2px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;border-radius:6px}
.item:hover{background:var(--surface-2)}
.item.pinned{background:var(--accent-soft)}
.item .tag{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.item .tag b{font-family:var(--math);font-weight:400;font-size:15px;color:var(--ink)}
.item .body{min-width:0}
.item .meta{grid-column:2;font-size:12.5px;color:var(--ink-2)}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:7px;overflow:hidden;margin:2px 0 8px}
.seg button{border:0;background:none;padding:3px 10px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toolbar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
textarea.code{width:100%;min-height:150px;font:12.5px/1.45 var(--mono);background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:10px;resize:vertical;color:var(--ink)}
.btn{border:1px solid var(--rule);background:var(--surface-2);border-radius:7px;padding:5px 11px;font-size:13px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);margin:4px 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;border:1.5px solid var(--ink)}
.legend .lc::before{background:var(--ink)} .legend .lb::before{background:var(--surface)} .legend .li::before{background:var(--accent);border-color:var(--accent)}
svg text{font-family:var(--sans)}
.toric svg{width:100%;height:auto;max-height:360px;display:block}
.toric .pt{cursor:pointer}
dialog{border:1px solid var(--rule);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,94vw);max-height:88vh;box-shadow:0 20px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,14,20,.42)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.dlg-head h2{margin:0;font:600 16px/1.2 var(--sans)}
.dlg-body{padding:14px 18px 18px;overflow:auto;max-height:calc(88vh - 60px)}
.lib-group{margin:4px 0 16px}
.lib-group h3{font:500 13.5px/1.3 var(--sans);color:var(--ink-2);margin:8px 0 8px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lib-card{border:1px solid var(--rule);background:var(--surface);border-radius:9px;padding:8px 10px 9px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.lib-card:hover{border-color:var(--accent)}
.lib-card .nm{font-weight:500;font-size:13px;line-height:1.25}
.lib-card .ds{font-size:12px;color:var(--ink-2);line-height:1.3;font-family:var(--math)}
.lib-card svg{width:44px;height:44px}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.form-row label{color:var(--ink-2);font-size:13px}
.form-row input[type=number]{width:70px;border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:3px 6px}
.form-row select{border:1px solid var(--rule);background:var(--surface-2);border-radius:6px;padding:3px 6px}
.help h3{font:600 14px/1.3 var(--sans);margin:16px 0 4px}
.help p,.help li{color:var(--ink-2);max-width:72ch}
.help ul{padding-left:18px;margin:4px 0}
.help kbd{font:500 11.5px var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
.mini{font-size:12.5px;color:var(--ink-2)}
.pill{display:inline-block;font-size:11.5px;border:1px solid var(--rule);border-radius:999px;padding:0 7px;color:var(--ink-2);margin-left:6px}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
@media (max-width: 980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto}
  header{flex-wrap:wrap;padding:8px 12px;gap:8px}
  .brand p{display:none}
  .rail{grid-row:2;flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid var(--rule);padding:6px;overflow-x:auto}
  .rail hr{width:1px;height:24px;border:0;border-left:1px solid var(--rule);margin:0 4px}
  .stage{grid-row:3}
  aside.panel{grid-row:4;border-left:0;border-top:1px solid var(--rule);min-height:70vh}
  .summary-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="../../lab.html" title="Back to minsungkho.github.io">← M.Kho</a>
    <div class="brand">
      <h1><span class="mark"></span><span class="mark b"></span>Dimer Lab</h1>
      <p>Brane tilings and their cluster integrable systems</p>
    </div>
    <div class="hgroup">
      <button class="hbtn" id="btnLibrary">Examples</button>
      <button class="hbtn" id="btnImport">Import</button>
      <button class="hbtn" id="btnNew">New canvas</button>
    </div>
    <div class="hgroup">
      <button class="hbtn icon" id="btnTheme" aria-label="Switch light or dark theme" title="Switch theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button>
      <button class="hbtn icon" id="btnHelp" aria-label="How Dimer Lab works" title="How it works">?</button>
    </div>
  </header>

  <nav class="rail" aria-label="Drawing tools">
    <button class="tool" data-tool="select" aria-label="Select and move (V)" title="Select and move"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 2.5l9.5 7.2-4.3.6 2.6 5-1.8.9-2.6-5-3.4 3z" fill="currentColor"/></svg><kbd>V</kbd></button>
    <button class="tool" data-tool="white" aria-label="Place white node (W)" title="Place white node"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><kbd>W</kbd></button>
    <button class="tool" data-tool="black" aria-label="Place black node (B)" title="Place black node"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="currentColor"/></svg><kbd>B</kbd></button>
    <button class="tool" data-tool="edge" aria-label="Connect nodes (E)" title="Connect a white and a black node"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="13.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="4.5" r="2.8" fill="currentColor"/><path d="M6 11.6l6-5.3" stroke="currentColor" stroke-width="1.5"/></svg><kbd>E</kbd></button>
    <button class="tool" data-tool="path" aria-label="Trace a loop (P)" title="Trace a loop for Poisson brackets"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 13c2-6 4 2 6-4s5-3 6-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="3" cy="13" r="1.8" fill="currentColor"/></svg><kbd>P</kbd></button>
    <button class="tool" data-tool="erase" aria-label="Erase (X)" title="Erase a node or an edge"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><kbd>X</kbd></button>
    <hr>
    <button class="tool" id="btnUndo" aria-label="Undo (Ctrl+Z)" title="Undo"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M6.5 5L3 8.5 6.5 12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 8.5h7a4 4 0 0 1 0 8H8" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="tool" id="btnRedo" aria-label="Redo (Ctrl+Shift+Z)" title="Redo"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11.5 5L15 8.5 11.5 12" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 8.5h-7a4 4 0 0 0 0 8H10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button class="tool" id="btnTidy" aria-label="Tidy layout" title="Tidy layout (harmonic embedding on the torus)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l6.1 3.5v7L9 16l-6.1-3.5v-7z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="9" r="1.6" fill="currentColor"/></svg></button>
    <button class="tool" id="btnShape" aria-label="Switch torus shape" title="Switch torus shape: square or hexagonal"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 14h9l3-10H6z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  </nav>

  <main class="stage" id="stage">
    <svg id="cv" role="img" aria-label="Bipartite graph on the torus. The middle square is the fundamental domain; the faded copies around it are its periodic images."></svg>

<script>
/* Dimer Lab analysis engine.
   Model: { nodes:[{id,c:'W'|'B',x,y}], edges:[{id,w,b,dx,dy,bend,sign}], lattice:{a:[ax,ay],b:[bx,by]} }
   x,y in [0,1) are coordinates in the torus basis; an edge joins white w (cell 0) to black b in cell (dx,dy).
   Half-edge 2k = W->B of edge k, 2k+1 = B->W. */
var DimerEngine = (function () {
  'use strict';

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { const t = a % b; a = b; b = t; } return a; }
  function cross(o, a, b) { return (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]); }

  const pad2 = (n) => (n < 10 ? '0' + n : '' + n);
  function edgeName(i, j, k, wide) {
    const p = 'e'.repeat(k + 1);
    return wide ? p + pad2(i) + pad2(j) : p + i + j;
  }
  function edgeTex(i, j, k, wide) {
    const pr = k === 0 ? '' : '^{' + "\\prime".repeat(k) + '}';
    const sub = wide ? i + ',' + j : '' + i + j;
    return 'e' + pr + '_{' + sub + '}';
  }

  /* ---------- geometry & combinatorics ---------- */
  function buildGraph(model) {
    const L = model.lattice || { a: [1, 0], b: [0, 1] };
    const toW = (t) => [L.a[0] * t[0] + L.b[0] * t[1], L.a[1] * t[0] + L.b[1] * t[1]];
    const idx = new Map();
    const whites = [], blacks = [];
    model.nodes.forEach((n) => { if (n.c === 'W') whites.push(n); else blacks.push(n); });
    whites.forEach((n, i) => idx.set(n.id, { c: 'W', i, v: i }));
    blacks.forEach((n, i) => idx.set(n.id, { c: 'B', i, v: whites.length + i }));
    const V = whites.length + blacks.length;
    const pos = new Array(V);
    whites.forEach((n, i) => { pos[i] = [n.x, n.y]; });
    blacks.forEach((n, i) => { pos[whites.length + i] = [n.x, n.y]; });

    const E = [];
    const dupCount = new Map();
    const wide = whites.length >= 10 || blacks.length >= 10;
    model.edges.forEach((e) => {
      const W = idx.get(e.w), B = idx.get(e.b);
      if (!W || !B || W.c !== 'W' || B.c !== 'B') return;
      const key = W.i + ',' + B.i;
      const k = dupCount.get(key) || 0; dupCount.set(key, k + 1);
      E.push({ id: e.id, wi: W.i, bi: B.i, wv: W.v, bv: B.v, dx: e.dx | 0, dy: e.dy | 0, bend: e.bend || 0,
        override: (e.sign === 1 || e.sign === -1) ? e.sign : 0,
        dup: k, wide, name: edgeName(W.i + 1, B.i + 1, k, wide), tex: edgeTex(W.i + 1, B.i + 1, k, wide) });
    });

    // half-edge tangents for rotation system
    const nH = 2 * E.length;
    const hOrig = new Int32Array(nH), hHead = new Int32Array(nH), hAng = new Float64Array(nH);
    const hOff = new Array(nH), hSgn = new Int8Array(nH);
    E.forEach((e, k) => {
      const p0 = toW(pos[e.wv]);
      const pb = pos[e.bv];
      const p2 = toW([pb[0] + e.dx, pb[1] + e.dy]);
      const mx = (p0[0] + p2[0]) / 2, my = (p0[1] + p2[1]) / 2;
      const vx = p2[0] - p0[0], vy = p2[1] - p0[1];
      const c = [mx - e.bend * vy, my + e.bend * vx];
      let t0 = [c[0] - p0[0], c[1] - p0[1]], t2 = [c[0] - p2[0], c[1] - p2[1]];
      if (Math.hypot(t0[0], t0[1]) < 1e-12) { t0 = [vx, vy]; t2 = [-vx, -vy]; }
      hOrig[2 * k] = e.wv; hHead[2 * k] = e.bv; hAng[2 * k] = Math.atan2(t0[1], t0[0]);
      hOrig[2 * k + 1] = e.bv; hHead[2 * k + 1] = e.wv; hAng[2 * k + 1] = Math.atan2(t2[1], t2[0]);
      hOff[2 * k] = [e.dx, e.dy]; hOff[2 * k + 1] = [-e.dx, -e.dy];
      hSgn[2 * k] = 1; hSgn[2 * k + 1] = -1;
      e.ctrl = c; e.p0 = p0; e.p2 = p2;
    });
    const rot = Array.from({ length: V }, () => []);
    for (let h = 0; h < nH; h++) rot[hOrig[h]].push(h);
    const warnings = [];
    const rotPos = new Int32Array(nH);
    rot.forEach((lst, v) => {
      lst.sort((a, b) => hAng[a] - hAng[b]);
      lst.forEach((h, i) => { rotPos[h] = i; });
      for (let i = 0; i < lst.length; i++) {
        const a = hAng[lst[i]], b = hAng[lst[(i + 1) % lst.length]];
        if (lst.length > 1 && Math.abs(((b - a + 3 * Math.PI) % (2 * Math.PI)) - Math.PI) > Math.PI - 1e-9)
          warnings.push({ kind: 'overlap', v });
      }
    });
    const ccwNext = (h) => { const l = rot[hOrig[h]]; return l[(rotPos[h] + 1) % l.length]; };
    const cwNext = (h) => { const l = rot[hOrig[h]]; return l[(rotPos[h] - 1 + l.length) % l.length]; };
    return { L, toW, whites, blacks, V, nW: whites.length, nB: blacks.length, pos, E, nH, hOrig, hHead, hAng, hOff, hSgn,
      rot, rotPos, ccwNext, cwNext, warnings };
  }

  function traceOrbits(G, next) {
    const seen = new Int32Array(G.nH).fill(-1);
    const orbits = [];
    for (let h0 = 0; h0 < G.nH; h0++) {
      if (seen[h0] >= 0) continue;
      const orb = []; let h = h0;
      while (seen[h] < 0) { seen[h] = orbits.length; orb.push(h); h = next(h); }
      orbits.push(orb);
    }
    return { orbits, of: seen };
  }

  function chainOfWalk(G, walk) {
    const c = new Int32Array(G.E.length);
    walk.forEach((h) => { c[h >> 1] += G.hSgn[h]; });
    return c;
  }
  function homologyOfWalk(G, walk) {
    let a = 0, b = 0; walk.forEach((h) => { a += G.hOff[h][0]; b += G.hOff[h][1]; }); return [a, b];
  }
  function homologyOfChain(G, c) {
    let a = 0, b = 0; G.E.forEach((e, k) => { a += c[k] * e.dx; b += c[k] * e.dy; }); return [a, b];
  }

  /* ---------- GF(2) Kasteleyn signs ---------- */
  function kasteleynSigns(G, faces) {
    const nE = G.E.length;
    const fixed = new Int8Array(nE).fill(-1);
    G.E.forEach((e, k) => { if (e.override) fixed[k] = e.override < 0 ? 1 : 0; });
    const rows = [];
    faces.forEach((f) => {
      const row = new Uint8Array(nE + 1);
      f.forEach((h) => { row[h >> 1] ^= 1; });
      row[nE] = ((f.length / 2) + 1) & 1;
      for (let k = 0; k < nE; k++) if (fixed[k] >= 0 && row[k]) { row[k] = 0; row[nE] ^= fixed[k]; }
      rows.push(row);
    });
    // Gaussian elimination
    const pivCol = []; let r = 0;
    for (let col = 0; col < nE && r < rows.length; col++) {
      if (fixed[col] >= 0) continue;
      let p = -1; for (let i = r; i < rows.length; i++) if (rows[i][col]) { p = i; break; }
      if (p < 0) continue;
      [rows[r], rows[p]] = [rows[p], rows[r]];
      for (let i = 0; i < rows.length; i++) if (i !== r && rows[i][col]) for (let j = col; j <= nE; j++) rows[i][j] ^= rows[r][j];
      pivCol.push(col); r++;
    }
    let consistent = true;
    for (let i = r; i < rows.length; i++) if (rows[i][nE]) consistent = false;
    const s = new Int8Array(nE);
    for (let k = 0; k < nE; k++) s[k] = fixed[k] >= 0 ? fixed[k] : 0;
    pivCol.forEach((col, i) => { s[col] = rows[i][nE]; });
    const sign = Array.from(s, (v) => (v ? -1 : 1));
    // verify per face
    const faceCheck = faces.map((f) => {
      let neg = 0; f.forEach((h) => { if (sign[h >> 1] < 0) neg++; });
      const need = ((f.length / 2) + 1) & 1;
      return { len: f.length, neg, ok: (neg & 1) === need };
    });
    return { sign, consistent: consistent && faceCheck.every((x) => x.ok), faceCheck };
  }

  /* ---------- perfect matchings ---------- */
  function perfectMatchings(G, sign, cap) {
    const n = G.nW;
    if (n !== G.nB) return { list: [], truncated: false, error: 'unequal' };
    const adj = Array.from({ length: n }, () => []);
    G.E.forEach((e, k) => adj[e.wi].push(k));
    const order = [...Array(n).keys()].sort((a, b) => adj[a].length - adj[b].length);
    const used = new Uint8Array(n), pick = new Int32Array(n);
    const list = []; let truncated = false;
    function rec(t) {
      if (truncated) return;
      if (t === n) {
        const edges = Array.from(pick);
        const sigma = new Int32Array(n);
        let hx = 0, hy = 0, sg = 1;
        edges.forEach((k) => { const e = G.E[k]; sigma[e.wi] = e.bi; hx += e.dx; hy += e.dy; sg *= sign[k]; });
        // permutation sign
        const vis = new Uint8Array(n);
        for (let i = 0; i < n; i++) if (!vis[i]) { let j = i, len = 0; while (!vis[j]) { vis[j] = 1; j = sigma[j]; len++; } if (len % 2 === 0) sg = -sg; }
        list.push({ edges, h: [hx, hy], sign: sg });
        if (list.length >= cap) truncated = true;
        return;
      }
      const w = order[t];
      for (const k of adj[w]) { const b = G.E[k].bi; if (used[b]) continue; used[b] = 1; pick[w] = k; rec(t + 1); used[b] = 0; if (truncated) return; }
    }
    if (n > 0) rec(0);
    return { list, truncated };
  }

  /* ---------- polygon ---------- */
  function convexHull(pts) {
    const P = pts.map((p) => p.slice()).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const uniq = P.filter((p, i) => i === 0 || p[0] !== P[i - 1][0] || p[1] !== P[i - 1][1]);
    if (uniq.length < 3) return uniq;
    const lo = [], up = [];
    for (const p of uniq) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = uniq.length - 1; i >= 0; i--) { const p = uniq[i]; while (up.length >= 2 && cross(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    up.pop(); lo.pop(); return lo.concat(up); // CCW
  }
  function polygonData(points) {
    const hull = convexHull(points);
    const res = { hull, interior: [], boundary: [], area2: 0, steps: [] };
    if (hull.length < 3) { res.degenerate = true; return res; }
    let a2 = 0; for (let i = 0; i < hull.length; i++) { const p = hull[i], q = hull[(i + 1) % hull.length]; a2 += p[0] * q[1] - p[1] * q[0]; }
    res.area2 = a2;
    const xs = hull.map((p) => p[0]), ys = hull.map((p) => p[1]);
    for (let x = Math.min(...xs); x <= Math.max(...xs); x++) for (let y = Math.min(...ys); y <= Math.max(...ys); y++) {
      let inside = true, onB = false;
      for (let i = 0; i < hull.length; i++) { const c = cross(hull[i], hull[(i + 1) % hull.length], [x, y]); if (c < 0) { inside = false; break; } if (c === 0) onB = true; }
      if (!inside) continue;
      (onB ? res.boundary : res.interior).push([x, y]);
    }
    for (let i = 0; i < hull.length; i++) {
      const p = hull[i], q = hull[(i + 1) % hull.length]; const dx = q[0] - p[0], dy = q[1] - p[1]; const g = gcd(dx, dy);
      for (let t = 0; t < g; t++) res.steps.push([dx / g, dy / g]);
    }
    return res;
  }

  /* ---------- linear algebra helpers ---------- */
  function rankFloat(M, tol) {
    const A = M.map((r) => r.slice()); const m = A.length; if (!m) return 0; const n = A[0].length; let r = 0;
    let scale = 0; A.forEach((row) => row.forEach((v) => { scale = Math.max(scale, Math.abs(v)); }));
    const eps = (tol || 1e-9) * Math.max(1, scale);
    for (let c = 0; c < n && r < m; c++) {
      let p = r; for (let i = r + 1; i < m; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
      if (Math.abs(A[p][c]) <= eps) continue;
      [A[r], A[p]] = [A[p], A[r]];
      for (let i = r + 1; i < m; i++) { const f = A[i][c] / A[r][c]; if (f) for (let j = c; j < n; j++) A[i][j] -= f * A[r][j]; }
      r++;
    }
    return r;
  }
  // exact rank over Q using BigInt fraction-free elimination
  function rankExact(M) {
    const A = M.map((r) => r.map((v) => BigInt(Math.round(v)))); const m = A.length; if (!m) return 0; const n = A[0].length; let r = 0;
    for (let c = 0; c < n && r < m; c++) {
      let p = -1; for (let i = r; i < m; i++) if (A[i][c] !== 0n) { p = i; break; }
      if (p < 0) continue; [A[r], A[p]] = [A[p], A[r]];
      for (let i = r + 1; i < m; i++) { if (A[i][c] === 0n) continue; const a = A[r][c], b = A[i][c]; for (let j = c; j < n; j++) A[i][j] = A[i][j] * a - A[r][j] * b; }
      r++;
    }
    return r;
  }
  // Solve D n = c for integer-valued n (D: rows x cols, full column rank); precomputes an inverse on pivot rows.
  function makeSolver(D, cols) {
    const rows = D.length;
    // choose pivot rows by elimination on a copy
    const A = D.map((r) => r.slice()); const pivRows = []; const used = new Uint8Array(rows);
    for (let col = 0; col < cols; col++) {
      let p = -1, best = 1e-9; for (let i = 0; i < rows; i++) if (!used[i] && Math.abs(A[i][col]) > best) { best = Math.abs(A[i][col]); p = i; }
      if (p < 0) continue; used[p] = 1; pivRows.push(p);
      for (let i = 0; i < rows; i++) if (i !== p && A[i][col]) { const f = A[i][col] / A[p][col]; for (let j = col; j < cols; j++) A[i][j] -= f * A[p][j]; }
    }
    if (pivRows.length < cols) return function () { return null; };
    // invert the square submatrix S = D[pivRows]
    const n = cols; const M = pivRows.map((r, i) => D[r].slice().concat(Array.from({ length: n }, (_, j) => (i === j ? 1 : 0))));
    for (let c = 0; c < n; c++) {
      let p = c; for (let i = c + 1; i < n; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
      [M[c], M[p]] = [M[p], M[c]]; const d = M[c][c]; for (let j = 0; j < 2 * n; j++) M[c][j] /= d;
      for (let i = 0; i < n; i++) if (i !== c && M[i][c]) { const f = M[i][c]; for (let j = 0; j < 2 * n; j++) M[i][j] -= f * M[c][j]; }
    }
    const Inv = M.map((r) => r.slice(n));
    return function (c) {
      const x = new Array(n);
      for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < n; j++) s += Inv[i][j] * c[pivRows[j]]; x[i] = Math.round(s); }
      for (let i = 0; i < rows; i++) { let s = 0; const r = D[i]; for (let j = 0; j < n; j++) if (r[j]) s += r[j] * x[j]; if (s !== c[i]) return null; }
      return x;
    };
  }

  /* ---------- conjugate-surface intersection pairing ---------- */
  function makePairing(G, conjugate) {
    // cyclic order of outgoing half-edges at each vertex; reversed at white vertices on the conjugate surface
    const order = G.rot.map((lst, v) => (conjugate && v < G.nW) ? lst.slice().reverse() : lst);
    return function (c1, c2) {
      let tot = 0;
      for (let v = 0; v < G.V; v++) {
        const lst = order[v]; const d = lst.length; if (d < 2) continue;
        const a = new Array(d), b = new Array(d); let any1 = false, any2 = false;
        for (let i = 0; i < d; i++) { const h = lst[i]; const s = G.hSgn[h]; a[i] = s * c1[h >> 1]; b[i] = s * c2[h >> 1]; if (a[i]) any1 = true; if (b[i]) any2 = true; }
        if (!any1 || !any2) continue;
        // sum_{i<j} (a_i b_j - a_j b_i) via prefix sums
        let pa = 0, pb = 0;
        for (let j = 0; j < d; j++) { tot += pa * b[j] - pb * a[j]; pa += a[j]; pb += b[j]; }
      }
      return tot / 2;
    };
  }

  function findWindingLoop(G, target) {
    if (G.V === 0) return null;
    const start = 0; const key = (v, x, y) => v + ':' + x + ':' + y;
    const prev = new Map(); prev.set(key(start, 0, 0), null);
    const q = [[start, 0, 0]]; const R = 6;
    const adjOut = Array.from({ length: G.V }, () => []);
    for (let h = 0; h < G.nH; h++) adjOut[G.hOrig[h]].push(h);
    while (q.length) {
      const [v, x, y] = q.shift();
      for (const h of adjOut[v]) {
        const u = G.hHead[h], nx = x + G.hOff[h][0], ny = y + G.hOff[h][1];
        if (Math.abs(nx) > R || Math.abs(ny) > R) continue;
        const k = key(u, nx, ny); if (prev.has(k)) continue;
        prev.set(k, [key(v, x, y), h]);
        if (u === start && nx === target[0] && ny === target[1]) {
          const walk = []; let cur = k; while (prev.get(cur)) { const [pk, hh] = prev.get(cur); walk.push(hh); cur = pk; }
          return walk.reverse();
        }
        q.push([u, nx, ny]);
      }
    }
    return null;
  }

  /* ---------- main ---------- */
  function analyze(model, opts) {
    opts = opts || {};
    const cap = opts.pmCap || 60000;
    const R = { ok: false, errors: [], warnings: [] };
    const G = buildGraph(model); R.G = G;
    if (G.overlapWarn) R.warnings.push('overlap');
    if (G.warnings.length) R.warnings.push('Two edges leave a node in the same direction; bend one of them so the cyclic order is defined.');
    R.counts = { W: G.nW, B: G.nB, E: G.E.length };
    if (G.nW === 0 || G.nB === 0 || G.E.length === 0) { R.empty = true; return R; }
    const lone = [];
    for (let v = 0; v < G.V; v++) if (G.rot[v].length === 0) lone.push(v);
    if (lone.length) R.errors.push(lone.length + ' node(s) have no edges.');
    if (G.nW !== G.nB) R.errors.push('Numbers of white (' + G.nW + ') and black (' + G.nB + ') nodes differ, so there are no perfect matchings.');

    const F = traceOrbits(G, (h) => G.cwNext(h ^ 1));
    const faces = F.orbits; R.faces = faces; R.faceOf = F.of;
    const chi = G.V - G.E.length + faces.length; R.chi = chi;
    R.counts.F = faces.length;
    // face homology & centroid
    R.hFaceCent = new Array(G.nH);
    R.faceInfo = faces.map((f, i) => {
      const hom = homologyOfWalk(G, f);
      let cx = 0, cy = 0, ox = 0, oy = 0; const poly = []; const offs = [];
      f.forEach((h) => { const p = G.pos[G.hOrig[h]]; poly.push([p[0] + ox, p[1] + oy]); offs.push([ox, oy]); cx += p[0] + ox; cy += p[1] + oy; ox += G.hOff[h][0]; oy += G.hOff[h][1]; });

  function kEntryTeX(i, j) {

  function legClick(s) {

  /* ================= Paths: user-drawn loops and their Poisson brackets ================= */
  function pathEdgeBetween(a, b) {

    else cands = state.model.edges.filter((e) => e.b === a.id && e.w === b.id && e.dx === a.cell[0] - b.cell[0] && e.dy === a.cell[1] - b.cell[1]);

  function pathClick(hit) {

    const st = pathEdgeBetween(P.last, hit);
    if (!st) { toast('No edge joins these two copies. Pick a neighbour of the last node.'); return; }
    P.steps.push(st); P.last = { id: hit.id, cell: hit.cell.slice() };

      state.path = null; state.tab = 'paths'; state.pin = 'path:' + (state.paths.length - 1);

  PANELS.paths = function (R) {

    L.push({ g: 'Start here', n: 'dP₀', d: 'ℂ³/ℤ₃ (1,1,1)', make: () => C3orb(3, 1) });
    L.push({ g: 'Start here', n: 'F₀', d: 'phase I, conifold/ℤ₂', make: () => D.orbifold(CONP, [[1, 1], [-1, 1]]) });
    const K = DATA.paperK;
    L.push({ g: 'Project notebooks', n: 'dP₀', d: 'Kasteleyn matrix from notebook 1', make: () => fromK(K.dP0) });
    L.push({ g: 'Project notebooks', n: 'Y³˒³', d: 'notebook 2', make: () => fromK(K.Y33) });
    L.push({ g: 'Project notebooks', n: 'dP₁', d: 'notebook 3, doubled edge', make: () => fromK(K.dP1) });
    L.push({ g: 'Project notebooks', n: 'L²˒⁵˒¹', d: 'notebook 4, Y³˒³ plus e₁₅', make: () => fromK(K.L251) });
    [4, 5, 6].forEach((N) => L.push({ g: 'Orbifold families', n: `Y${sup(N + ',' + N)}`, d: `ℂ³/ℤ${sub(2 * N)} (1,1,${2 * N - 2})`, make: () => C3orb(2 * N, 1) }));
    [4, 5, 6].forEach((N) => L.push({ g: 'Orbifold families', n: `ℂ³/ℤ${sub(N * (N - 2))}`, d: `(1,${N - 2},${N * (N - 2) - N + 1}), N = ${N}`, make: () => C3orb(N * (N - 2), N - 2) }));
    Object.keys(DATA.reflexive).forEach((k) => {
      const num = k.replace('Model', ''); const base = 'Model' + num.replace(/[a-z]$/, '');
      L.push({ g: 'Reflexive polygons (Hanany–Seong numbering)', n: 'Model ' + num, d: RN[base] || '', make: () => D.fromSuperpotential(DATA.reflexive[k]) });
    });
    return L;
  }
  const SUBD = '₀₁₂₃₄₅₆₇₈₉'; const sub = (n) => String(n).split('').map((c) => SUBD[+c] || c).join('');
  const SUPM = { 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹', ',': '˒' }; const sup = (s) => String(s).split('').map((c) => SUPM[c] || c).join('');
  let LIB = null; const thumbCache = new Map();
  function openLibrary() {
    LIB = LIB || library();
    const groups = [...new Set(LIB.map((x) => x.g))];
    $('#libBody').innerHTML = groups.map((g) => `<section class="lib-group"><h3>${esc(g)}</h3><div class="lib-grid">${LIB.map((x, i) => [x, i]).filter(([x]) => x.g === g).map(([x, i]) => `<button class="lib-card" data-lib="${i}"><span data-thumb="${i}"></span><span><span class="nm">${esc(x.n)}</span><br><span class="ds">${esc(x.d)}</span></span></button>`).join('')}</div></section>`).join('');
    $('#dlgLibrary').showModal();
    // thumbnails lazily
    let i = 0; const step = () => {
      const t0 = performance.now();
      while (i < LIB.length && performance.now() - t0 < 30) {
        const el = $(`[data-thumb="${i}"]`);
        if (el) { try { let svg = thumbCache.get(i); if (!svg) { const R = D.analyze(LIB[i].make(), { pmCap: 20000, polygonOnly: true }); svg = R.points ? toricSVG(R, { mini: true, size: 44, max: 12 }) : ''; thumbCache.set(i, svg); } el.innerHTML = svg; } catch (e) { /* ignore */ } }
        i++;
      }
      if (i < LIB.length && $('#dlgLibrary').open) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  /* ---------------- import dialog ---------------- */
  let impMode = 'w';
  function renderImport() {
    $$('#impSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.imp === impMode)));
    const P = $('#impPane'); $('#impMsg').innerHTML = '';
    if (impMode === 'w') P.innerHTML = `<p class="mini">Positive terms become white nodes, negative terms black nodes; the cyclic order of fields in each term fixes the embedding. Fields may be written X_{1,2}, X_{12}, X12 or X[1,2]; superscripts like X^1_{12} tell copies apart.</p><textarea class="code" id="impText" placeholder="W = X_{1,2}X_{2,3}X_{3,1} + ... - ...">X_{1,2} Z_{2,3} Y_{3,1} + Y_{1,2} X_{2,3} Z_{3,1} + Z_{1,2} Y_{2,3} X_{3,1} - X_{1,2} X_{2,3} X_{3,1} - Z_{1,2} Z_{2,3} Z_{3,1} - Y_{1,2} Y_{2,3} Y_{3,1}</textarea><div class="toolbar-row"><button class="btn primary" data-doimp>Build tiling</button></div>`;
    else if (impMode === 'k') P.innerHTML = `<p class="mini">Mathematica-style matrix, rows white and columns black. Each term of an entry is one edge; its powers of <i>x</i> and <i>y</i> are the winding of the black end. Signs are kept if they satisfy the Kasteleyn condition.</p><textarea class="code" id="impText">${esc(DATA.paperK.dP1)}</textarea><div class="toolbar-row"><button class="btn primary" data-doimp>Build tiling</button></div>`;
    else if (impMode === 'orb') P.innerHTML = `<p class="mini">Abelian orbifolds of ℂ³ (hexagonal tiling) or of the conifold (square tiling).</p>
      <div class="form-row"><label>ℂ³/ℤ<sub>n</sub> (1, a, n−1−a)</label><label>n <input type="number" id="orbN" value="8" min="2" max="40"></label><label>a <input type="number" id="orbA" value="2" min="0" max="39"></label><button class="btn primary" data-doorb="c3">Build</button></div>
      <div class="form-row"><label>Sublattice basis</label><select id="orbParent"><option value="c3">ℂ³</option><option value="con">conifold</option></select><label>( <input type="number" id="m11" value="2"> <input type="number" id="m12" value="0"> ; <input type="number" id="m21" value="0"> <input type="number" id="m22" value="2"> )</label><button class="btn" data-doorb="gen">Build</button></div>
      <p class="mini">Columns of the matrix are the generators of the sublattice in units of the parent cell; its determinant is the order of the orbifold group.</p>`;
    else P.innerHTML = `<p class="mini">Open a model file saved from Dimer Lab, or paste its text.</p><div class="toolbar-row"><input type="file" id="impFile" accept=".json,application/json"></div><textarea class="code" id="impText" placeholder='{"nodes": [...], "edges": [...]}'></textarea><div class="toolbar-row"><button class="btn primary" data-doimp>Open</button></div>`;
  }
  function doImport() {
    const txt = ($('#impText') || {}).value || '';
    try {
      let m, title;
      if (impMode === 'w') { m = D.fromSuperpotential(txt); title = 'Imported superpotential'; }
      else if (impMode === 'k') { m = fromK(txt); title = 'Imported Kasteleyn matrix'; }
      else { const o = JSON.parse(txt); m = o.model || o; title = o.title || 'Opened model'; if (!Array.isArray(m.nodes) || !Array.isArray(m.edges)) throw new Error('The file has no nodes or edges.'); }
      setModel(m, { fit: true, title });
      $('#dlgImport').close();
      if (m.importReport && !m.importReport.faithful) toast('Layout differs from the superpotential at some nodes; check the Summary tab.');
    } catch (e) { $('#impMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }
  function doOrb(kind) {
    try {
      let m, title;
      if (kind === 'c3') { const n = +$('#orbN').value, a = +$('#orbA').value; if (!(n >= 2 && a >= 0 && a < n)) throw new Error('Choose n ≥ 2 and 0 ≤ a < n.'); m = C3orb(n, a); title = `ℂ³/ℤ${sub(n)} (1,${a},${n - 1 - a})`; }
      else { const M = [[+$('#m11').value, +$('#m12').value], [+$('#m21').value, +$('#m22').value]]; const par = $('#orbParent').value === 'c3' ? HEXP : CONP; m = D.orbifold(par, D.reduceBasis(M, par.lattice)); title = ($('#orbParent').value === 'c3' ? 'ℂ³' : 'Conifold') + ' orbifold'; }
      setModel(m, { fit: true, title }); $('#dlgImport').close();
    } catch (e) { $('#impMsg').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; }
  }

  /* ---------------- help ---------------- */
  function renderHelp() {
    $('#helpBody').innerHTML = `
      <p>Dimer Lab treats your drawing as a bipartite graph on a torus. The solid square is one fundamental domain and the faded squares around it are its copies, so an edge drawn to a faded node crosses the boundary of the domain. Everything on the right is recomputed after each change.</p>
      <h3>Drawing</h3>
      <ul><li><kbd>W</kbd> and <kbd>B</kbd> place white and black nodes; <kbd>E</kbd> connects a white node to a black one; <kbd>X</kbd> erases; <kbd>V</kbd> selects and moves.</li>
      <li>Two edges between the same nodes with the same winding are drawn curved; adjust the curvature in the inspector.</li>
      <li>The hexagon button computes a harmonic (Tutte) embedding on the torus, which usually untangles a drawing without changing its combinatorics.</li>
      <li><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Z</kbd> undoes, <kbd>Shift</kbd> adds redo. Work is kept in this browser.</li></ul>
      <h3>Conventions</h3>
      <ul><li>Kasteleyn matrix: rows white, columns black. An edge from <i>w</i> to a black node in the copy shifted by (<i>a</i>, <i>b</i>) carries <i>x<sup>a</sup>y<sup>b</sup></i>. Signs solve the Kasteleyn condition over 𝔽₂; you may fix some by hand.</li>
      <li>The toric diagram is the Newton polygon of det <i>K</i>; each lattice point is a homology class of perfect matchings.</li>
      <li>Zig-zag paths turn maximally right at white nodes and maximally left at black nodes. Quiver arrows run clockwise around white nodes, and white nodes give the positive terms of <i>W</i>.</li>
      <li>Loop weights are alternating products of edge weights: an edge crossed from white to black goes in the numerator. Faces are read counterclockwise.</li>
      <li>The Poisson bracket is the Goncharov–Kenyon one: for loops γ, γ′, {<i>X</i><sub>γ</sub>, <i>X</i><sub>γ′</sub>} = ε(γ, γ′) <i>X</i><sub>γ</sub><i>X</i><sub>γ′</sub>, with ε the intersection number on the conjugate surface (cyclic order reversed at white nodes). On face loops it reproduces the quiver.</li>
      <li>Hamiltonians are <i>H</i><sub>(a,b)</sub> = Σ <i>w</i>(<i>M</i>)/<i>w</i>(<i>M</i><sub>0</sub>) over perfect matchings at an interior point, with a reference matching <i>M</i><sub>0</sub> at a corner. Their mutual brackets are checked exactly, monomial by monomial.</li></ul>
      <h3>Importing</h3>
      <p>Paste a toric superpotential, a Kasteleyn matrix in Mathematica syntax, or build an abelian orbifold of ℂ³ or of the conifold. The Examples menu includes the four models from the project notebooks and all thirty reflexive-polygon tilings.</p>`;
  }

  /* ---------------- events ---------------- */
  function bind() {
    const cv = $('#cv');
    cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove); cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', () => { state.drag = null; });
    cv.addEventListener('pointerleave', () => { state.cursor = null; if (state.pending) render(); });
    cv.addEventListener('wheel', onWheel, { passive: false });
    $$('.tool[data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
    $('#btnUndo').onclick = undo; $('#btnRedo').onclick = redo;
    $('#btnTidy').onclick = () => { try { const m = D.tutteLayout(JSON.parse(JSON.stringify(state.model))); setModel(m, { resetRef: false }); } catch (e) { toast('Layout failed: ' + e.message); } };
    $('#btnShape').onclick = () => { const L = lat(); const isSq = Math.abs(L.b[0]) < 1e-9 && Math.abs(L.a[1]) < 1e-9 && Math.abs(L.a[0] - 1) < 1e-9 && Math.abs(L.b[1] - 1) < 1e-9; pushUndo(); state.model.lattice = isSq ? { ...HEX } : { ...SQ }; fit(); changed(); toast(isSq ? 'Hexagonal torus' : 'Square torus'); };
    $('#zIn').onclick = () => { const s = $('#cv'); zoomAt([s.clientWidth / 2, s.clientHeight / 2], 1.25); };
    $('#zOut').onclick = () => { const s = $('#cv'); zoomAt([s.clientWidth / 2, s.clientHeight / 2], 0.8); };
    $('#zFit').onclick = fit;
    $$('.chip[data-view]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.view; state.show[k] = !state.show[k]; b.setAttribute('aria-pressed', String(state.show[k])); render(); }));
    $('#tabs').addEventListener('click', (ev) => { const t = ev.target.closest('[data-tab]'); if (!t) return; state.tab = t.dataset.tab; renderPanel(); });
    $('#tabs').addEventListener('keydown', (ev) => { if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return; const i = TABS.findIndex((t) => t[0] === state.tab); const j = (i + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length; state.tab = TABS[j][0]; renderPanel(); $(`[data-tab="${state.tab}"]`).focus(); });
    const tb = $('#tabbody');
    tb.addEventListener('mouseover', (ev) => { const el = ev.target.closest('[data-hl]'); const k = el ? el.dataset.hl : null; if (k !== state.hover) { state.hover = k; render(); } });
    tb.addEventListener('mouseleave', () => { if (state.hover) { state.hover = null; render(); } });
    tb.addEventListener('click', (ev) => {
      const hl = ev.target.closest('[data-hl]'); if (hl && !ev.target.closest('button')) { state.pin = state.pin === hl.dataset.hl ? null : hl.dataset.hl; markPinned(); render(); }
      const f = ev.target.closest('[data-form]'); if (f) { state.form = f.dataset.form; renderPanel(); return; }
      const leg = ev.target.closest('[data-leg]'); if (leg) { legClick(leg.dataset.leg); return; }
      const dp = ev.target.closest('[data-delpath]'); if (dp) { state.paths.splice(+dp.dataset.delpath, 1); state.pin = null; renderPanel(); render(); return; }
      const mo = ev.target.closest('[data-mutopen]'); if (mo) { state.mutOpen = state.mutOpen === +mo.dataset.mutopen ? null : +mo.dataset.mutopen; renderPanel(); return; }
      const lo = ev.target.closest('[data-libopen]'); if (lo) { const x = LIB[+lo.dataset.libopen]; setModel(x.make(), { fit: true, title: x.n + (x.d ? ' — ' + x.d : '') }); state.tab = 'gtp'; return; }
      const oo = ev.target.closest('[data-orbopen]'); if (oo) { const m = oo.dataset.orbopen.match(/ℤ([₀-₉]+) \(1,(\d+),(\d+)\)/); if (m) { const n = +m[1].split('').map((c) => '₀₁₂₃₄₅₆₇₈₉'.indexOf(c)).join(''); setModel(C3orb(n, +m[2]), { fit: true, title: oo.dataset.orbopen }); state.tab = 'gtp'; } return; }
      const pt = ev.target.closest('[data-pt]'); if (pt) { const p = pt.dataset.pt.split(',').map(Number); if (state.tab !== 'toric') state.tab = 'toric'; state.ptSel = p; renderPanel(); return; }
      const go = ev.target.closest('[data-goto]'); if (go) { state.tab = go.dataset.goto; renderPanel(); return; }
      const rf = ev.target.closest('[data-ref]'); if (rf) { state.refPoint = rf.dataset.ref.split(',').map(Number); analyze(); toast('Reference matching moved'); return; }
      const cp = ev.target.closest('[data-copy]'); if (cp) { const R = state.R; const k = cp.dataset.copy; let t = ''; if (k === 'mma' || k === 'hmma' || k === 'kmma') t = exportMma(R); else if (k === 'tex' || k === 'htex') t = exportTeX(R); else if (k === 'json') t = JSON.stringify({ title: state.title, model: state.model }, null, 1); copyText(t); return; }
      const sv = ev.target.closest('[data-save]'); if (sv) { if (sv.dataset.save === 'json') saveFile(slug() + '.json', JSON.stringify({ title: state.title, model: state.model }, null, 1)); else saveFile(slug() + '.svg', svgExport()); }
    });
    $('#inspector').addEventListener('click', (ev) => {
      const a = ev.target.closest('[data-act]'); if (!a || !state.sel) return;
      if (a.dataset.act === 'delnode') deleteNode(state.sel.id);
      if (a.dataset.act === 'deledge') deleteEdge(state.sel.id);
      if (a.dataset.act === 'flip') { pushUndo(); const n = nodeById(state.sel.id); n.c = n.c === 'W' ? 'B' : 'W'; state.model.edges = state.model.edges.filter((e) => e.w !== n.id && e.b !== n.id); changed(); toast('Colour changed; its edges were removed'); }
    });
    $('#inspector').addEventListener('change', (ev) => {
      if (!state.sel || state.sel.kind !== 'edge') return; const e = state.model.edges.find((x) => x.id === state.sel.id); if (!e) return;
      if (ev.target.id === 'insSign') { pushUndo(); e.sign = ev.target.value === 'auto' ? null : +ev.target.value; changed(true); }
    });
    $('#inspector').addEventListener('input', (ev) => {
      if (ev.target.id !== 'insBend' || !state.sel) return; const e = state.model.edges.find((x) => x.id === state.sel.id); if (!e) return;
      if (!state._bendPushed) { pushUndo(); state._bendPushed = true; setTimeout(() => { state._bendPushed = false; }, 800); }
      e.bend = +ev.target.value; render(); clearTimeout(anaTimer); anaTimer = setTimeout(analyze, 200); save();
    });
    $('#btnLibrary').onclick = openLibrary;
    $('#libBody').addEventListener('click', (ev) => { const c = ev.target.closest('[data-lib]'); if (!c) return; const x = LIB[+c.dataset.lib]; try { setModel(x.make(), { fit: true, title: x.n + (x.d ? ' — ' + x.d : '') }); $('#dlgLibrary').close(); } catch (e) { toast('Could not open: ' + e.message); } });
    $('#btnImport').onclick = () => { renderImport(); $('#dlgImport').showModal(); };
    $('#impSeg').addEventListener('click', (ev) => { const b = ev.target.closest('[data-imp]'); if (!b) return; impMode = b.dataset.imp; renderImport(); });
    $('#impPane').addEventListener('click', (ev) => { if (ev.target.closest('[data-doimp]')) doImport(); const o = ev.target.closest('[data-doorb]'); if (o) doOrb(o.dataset.doorb); });
    $('#impPane').addEventListener('change', (ev) => { if (ev.target.id === 'impFile' && ev.target.files[0]) { const fr = new FileReader(); fr.onload = () => { $('#impText').value = fr.result; }; fr.readAsText(ev.target.files[0]); } });
    $('#btnNew').onclick = () => { setModel({ nodes: [], edges: [], lattice: { ...SQ } }, { fit: true, title: '' }); setTool('white'); };
    $('#btnHelp').onclick = () => { renderHelp(); $('#dlgHelp').showModal(); };
    $$('dialog').forEach((d) => d.addEventListener('click', (ev) => { if (ev.target.closest('[data-close]') || ev.target === d) d.close(); }));
    $('#btnTheme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('dimerlab.theme', r.dataset.theme); } catch (e) { /* */ } render(); renderPanel(); };
    window.addEventListener('keydown', (ev) => {
      if (ev.target.closest('input,textarea,select') || $('dialog[open]')) return;
      const mod = ev.metaKey || ev.ctrlKey;
      if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
      if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
      if (mod) return;
      const map = { v: 'select', w: 'white', b: 'black', e: 'edge', x: 'erase', p: 'path' };
      if (map[ev.key.toLowerCase()]) { setTool(map[ev.key.toLowerCase()]); return; }
      if ((ev.key === 'Delete' || ev.key === 'Backspace') && state.sel) { state.sel.kind === 'node' ? deleteNode(state.sel.id) : deleteEdge(state.sel.id); }
      if (ev.key === 'Escape') { state.path = null; state.pending = null; state.sel = null; state.pin = null; render(); markPinned(); }
      if (ev.key === 'f') fit();
    });
    new ResizeObserver(() => render()).observe($('#stage'));
  }
  function slug() { return (state.title || 'dimer').replace(/[^\w\u00C0-\uFFFF]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'dimer'; }

  /* ---------------- boot ---------------- */
  function boot() {
    try { const t = localStorage.getItem('dimerlab.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* */ }
    bind(); setTool('select');
    const saved = load();
    if (saved && saved.model.nodes.length) setModel(saved.model, { fresh: true, title: saved.title || '' });
    else setModel(fromK(DATA.paperK.dP1), { fresh: true, title: 'dP₁ — project notebook 3' });
    requestAnimationFrame(fit);
  }
  boot();
  window.__dimerlab = { state, ST, nodeById };
})();
